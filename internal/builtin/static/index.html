<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>moleAgent</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<header>
  <div class="header-left">
    <h1>moleAgent</h1>
    <span id="conn-badge" class="conn-badge offline">已断开</span>
  </div>
  <div class="header-right" id="header-info"></div>
</header>

<main class="container">
  <!-- 全局统计 -->
  <section class="card stats-grid" id="stats-bar"></section>

  <!-- 隧道列表 -->
  <section class="card">
    <div class="section-header">
      <h2>隧道列表</h2>
      <button class="btn btn-primary" id="btn-add">+ 新增隧道</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>名称</th><th>类型</th><th>目标</th>
          <th>状态</th><th>流入</th><th>流出</th><th>操作</th>
        </tr></thead>
        <tbody id="tunnels-tbody"></tbody>
      </table>
    </div>
  </section>

  <!-- 隧道详情面板 -->
  <section class="card hidden" id="detail-panel">
    <div class="section-header">
      <h2 id="detail-title">隧道详情</h2>
      <button class="btn btn-ghost" id="btn-close-detail">关闭</button>
    </div>
    <div id="detail-content"></div>
  </section>
</main>

<!-- 新增/编辑 Modal -->
<div class="modal hidden" id="edit-modal">
  <div class="modal-overlay"></div>
  <div class="modal-content">
    <h3 id="modal-title">新增隧道</h3>
    <div class="form-group">
      <label>名称</label>
      <input id="f-name" placeholder="如: web-proxy" autocomplete="off">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>类型</label>
        <select id="f-type">
          <option value="http">HTTP</option>
          <option value="https">HTTPS</option>
          <option value="tcp">TCP</option>
          <option value="udp">UDP</option>
          <option value="ser2mq">Ser2MQ</option>
          <option value="vpn-manager">VPN Manager</option>
        </select>
      </div>
      <div class="form-group">
        <label>目标</label>
        <input id="f-target" placeholder="如: 127.0.0.1:8080" autocomplete="off">
      </div>
    </div>
    <div id="para-fields"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="btn-cancel">取消</button>
      <button class="btn btn-primary" id="btn-submit">保存</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast-container"></div>

<script type="module" src="/ui/app.js"></script>
</body>
</html>
