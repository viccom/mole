# moleAgent_Serv 配置示例

server:
  control_port: ":9981"    # Node 连接端口（TCP）
  gateway_port: ":9980"    # 外部请求网关
  api_port: ":9983"        # REST API
  transport: "tcp"         # 主传输协议: tcp, ws, kcp (TLS 由 tls.enabled 控制, 仅 tcp/ws)
  ws_port: ""              # WebSocket 额外监听端口（空=禁用, 如 ":9988"）
  kcp_port: ""             # KCP/UDP 额外监听端口（空=禁用, 可与 TCP 共用端口号如 ":9981"）
  max_nodes: 10000
  max_concurrent: 50000
  tls:
    enabled: false         # 是否启用 TLS 加密控制端口
    cert_file: "certs/server.crt"  # TLS 证书文件路径
    key_file: "certs/server.key"    # TLS 私钥文件路径
  kcp:
    key: ""                # KCP 加密密钥（空=不加密）
    data_shards: 0         # FEC 数据分片数（0=禁用 FEC，推荐 10）
    parity_shards: 0       # FEC 校验分片数（推荐 3）
    nodelay: 1             # 0:默认, 1:启用低延迟模式
    interval: 10           # ACK 间隔 ms（默认 40, 推荐 10）
    resend: 2              # 快速重传阈值（推荐 2）
    no_congestion: 1       # 0:默认, 1:禁用拥塞控制（隧道场景推荐关闭）
    send_window: 0         # 发送窗口（0=使用默认值）
    recv_window: 0         # 接收窗口（0=使用默认值）
  gateway:
    hyphen_routing: true    # 泛域名分隔符: true=hyphen(-), false=dot(.)
    default_domain: ""      # 隧道访问地址默认域名，空则自动推断（如 mole.example.com）

mqtt:
  enabled: true
  tcp_port: ":1883"
  ws_port: ":1882"

auth:
  jwt_secret: ""           # 必须配置，空则启动失败。也可通过 MA_JWT_SECRET 环境变量设置
  jwt_expiry: "24h"
  bcrypt_cost: 12

database:
  path: "data/config.db"

logging:
  level: "info"            # debug, info, warn, error
  format: "text"           # text, json
  file:
    enabled: true
    path: "logs/moleagent.log"
    max_size_mb: 100
    max_backups: 10
    max_age_days: 30
    compress: true
  console:
    enabled: true
    color: true

feishu:
  app_id: ""               # 飞书企业自建应用 App ID，也可通过 MA_FEISHU_APP_ID 环境变量设置
  app_secret: ""           # 飞书企业自建应用 App Secret，也可通过 MA_FEISHU_APP_SECRET 环境变量设置

dingtalk:
  app_key: ""              # 钉钉企业自建应用 App Key，也可通过 MA_DINGTALK_APP_KEY 环境变量设置
  app_secret: ""           # 钉钉企业自建应用 App Secret，也可通过 MA_DINGTALK_APP_SECRET 环境变量设置
  corp_id: ""              # 钉钉企业 Corp ID（H5 JSAPI 登录需要），也可通过 MA_DINGTALK_CORP_ID 环境变量设置

ratelimit:
  api:
    enabled: false         # API 请求限流总开关
    per_user: 100          # 每用户每秒请求数 (0=不限)
    per_ip: 30             # 每IP每秒请求数 (0=不限)
    burst: 20              # 突发桶容量
  gateway:
    enabled: false         # Gateway 限流总开关
    max_conns_per_node: 1000     # 每节点最大并发连接 (0=不限，可被 API 按节点覆盖)
    max_conns_per_tunnel: 500    # 每隧道最大并发连接 (0=不限)
    max_bandwidth_per_tunnel: 0        sec (0=不限)/sec (0=不限)
    bw_burst: 65536             # 带宽突发桶容量 bytes
