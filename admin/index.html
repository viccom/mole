<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MoleAgent 管理后台</title>
<style>
:root{--p:#4F46E5;--pl:#818CF8;--pd:#3730A3;--bg:#F3F4F6;--c:#FFF;--sb:#1E1B4B;--sh:#312E81;--t:#111827;--t2:#6B7280;--bd:#E5E7EB;--ok:#059669;--okb:#D1FAE5;--er:#DC2626;--erb:#FEE2E2;--wa:#D97706;--wab:#FEF3C7;--in:#2563EB;--inb:#DBEAFE;--pu:#7C3AED;--pub:#EDE9FE;--r:8px;--sx:0 1px 3px rgba(0,0,0,.1)}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);font-size:14px}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1E1B4B,#4F46E5)}
.lc{background:var(--c);border-radius:12px;padding:40px;width:400px;max-width:90vw;box-shadow:0 20px 40px rgba(0,0,0,.2)}.lc h1{text-align:center;font-size:24px;color:var(--pd);margin-bottom:4px}.lc .sub{text-align:center;color:var(--t2);margin-bottom:32px}.lc .logo{text-align:center;margin-bottom:24px;color:var(--p)}.lc .logo svg{width:48px;height:48px}
.fg{margin-bottom:20px}.fg label{display:block;margin-bottom:6px;font-weight:500}.fg input,.fg select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:var(--r);font-size:14px;outline:none}.fg input:focus,.fg select:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:var(--r);font-size:14px;font-weight:500;cursor:pointer;transition:all .15s}.btn svg{width:16px;height:16px}.btn-p{background:var(--p);color:#fff}.btn-p:hover{background:var(--pd)}.btn-s{background:var(--ok);color:#fff}.btn-s:hover{opacity:.9}.btn-d{background:var(--er);color:#fff}.btn-d:hover{opacity:.9}.btn-g{background:transparent;color:var(--t2);border:1px solid var(--bd)}.btn-g:hover{background:var(--bg)}.btn-sm{padding:5px 10px;font-size:12px}.btn-blk{width:100%;justify-content:center;padding:12px}.btn:disabled{opacity:.5;cursor:not-allowed}
.app{display:flex;height:100vh}.sb{width:240px;background:var(--sb);color:#fff;display:flex;flex-direction:column;flex-shrink:0}
.sb-b{padding:20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.1)}.sb-b svg{width:28px;height:28px;flex-shrink:0}.sb-b span{font-size:16px;font-weight:600}
.sb-n{flex:1;padding:12px 0;overflow-y:auto}
.ni{display:flex;align-items:center;gap:12px;padding:10px 20px;color:rgba(255,255,255,.6);cursor:pointer;transition:all .15s;border-left:3px solid transparent;font-size:14px}.ni:hover{background:var(--sh);color:#fff}.ni.on{background:var(--sh);color:#fff;border-left-color:var(--pl)}.ni svg{width:20px;height:20px;flex-shrink:0}
.sb-f{padding:16px 20px;border-top:1px solid rgba(255,255,255,.1)}.sb-f .ui{font-size:13px;opacity:.7;margin-bottom:8px}
.mn{flex:1;display:flex;flex-direction:column;overflow:hidden}.tb{height:56px;background:var(--c);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 24px;flex-shrink:0}.tb h2{font-size:18px;font-weight:600}.ct{flex:1;overflow-y:auto;padding:24px}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.sc{background:var(--c);border-radius:var(--r);padding:20px;box-shadow:var(--sx);display:flex;align-items:center;gap:16px}.si{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}.si svg{width:24px;height:24px}.si.bl{background:var(--inb);color:var(--in)}.si.gr{background:var(--okb);color:var(--ok)}.si.or{background:var(--wab);color:var(--wa)}.si.pu{background:var(--pub);color:var(--pu)}.si h3{font-size:24px;font-weight:700;line-height:1.2}.si p{font-size:13px;color:var(--t2)}
.cd{background:var(--c);border-radius:var(--r);box-shadow:var(--sx)}.cd-h{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}.cd-h h3{font-size:16px;font-weight:600}.cd-b{padding:0}.cd-b.pad{padding:20px}
table{width:100%;border-collapse:collapse}th{background:var(--bg);font-weight:600;text-align:left;padding:10px 16px;font-size:13px;color:var(--t2);white-space:nowrap}td{padding:10px 16px;border-bottom:1px solid var(--bd)}tr:last-child td{border-bottom:none}tr:hover td{background:rgba(79,70,229,.02)}.acts{display:flex;gap:6px}
.bdg{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:500}.bdg::before{content:"";width:6px;height:6px;border-radius:50%}.bdg-ok{background:var(--okb);color:var(--ok)}.bdg-ok::before{background:var(--ok)}.bdg-er{background:var(--erb);color:var(--er)}.bdg-er::before{background:var(--er)}.bdg-in{background:var(--inb);color:var(--in)}.bdg-in::before{background:var(--in)}.bdg-wa{background:var(--wab);color:var(--wa)}.bdg-wa::before{background:var(--wa)}.bdg-pu{background:var(--pub);color:var(--pu)}.bdg-pu::before{background:var(--pu)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all .2s}.mo.show{opacity:1;visibility:visible}.ml{background:var(--c);border-radius:12px;width:480px;max-width:90vw;max-height:85vh;overflow-y:auto;box-shadow:0 20px 40px rgba(0,0,0,.15)}.ml-h{padding:20px 24px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}.ml-h h3{font-size:16px;font-weight:600}.ml-x{background:none;border:none;cursor:pointer;color:var(--t2);padding:4px}.ml-x svg{width:20px;height:20px}.ml-b{padding:24px}.ml-f{padding:16px 24px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px}
.tc{position:fixed;top:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}.toast{padding:12px 20px;border-radius:var(--r);color:#fff;font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.15);animation:si .3s;min-width:260px}.toast-ok{background:var(--ok)}.toast-er{background:var(--er)}.toast-in{background:var(--in)}@keyframes si{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.tabs{display:flex;border-bottom:2px solid var(--bd);margin-bottom:20px}.tab{padding:10px 20px;cursor:pointer;font-weight:500;color:var(--t2);border-bottom:2px solid transparent;margin-bottom:-2px}.tab:hover{color:var(--t)}.tab.on{color:var(--p);border-bottom-color:var(--p)}
.empty{text-align:center;padding:40px 20px;color:var(--t2)}.ld{text-align:center;padding:40px}.sp{display:inline-block;width:24px;height:24px;border:3px solid var(--bd);border-top-color:var(--p);border-radius:50%;animation:spn .6s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}
.dr{background:#F9FAFB}.dr td{padding:16px}.tchip{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:8px 12px;margin:4px;font-size:13px}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.cc{background:var(--bg);border-radius:var(--r);padding:16px}.cc h4{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--pd)}.ci{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}.ci .l{color:var(--t2)}.ci .v{font-weight:500;font-family:monospace}code{background:var(--bg);padding:2px 6px;border-radius:4px;font-size:13px;font-family:monospace}
@media(max-width:768px){.sb{position:fixed;z-index:100;transform:translateX(-100%)}.sb.open{transform:translateX(0)}.sg{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div class="tc" id="toasts"></div>
<div class="mo" id="modal"><div class="ml" id="mlc"></div></div>
<script>
const I={logo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>',dash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',node:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><circle cx="6" cy="6" r="1"/><circle cx="6" cy="18" r="1"/></svg>',tunnel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="M22 6l-10 7L2 6"/></svg>',user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',mqtt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>',gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>',plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>',unlink:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.84 12.25l1.72-1.71a3.55 3.55 0 0 0-5-5L13.85 7.25"/><path d="M5.16 11.75l-1.72 1.71a3.55 3.55 0 0 0 5 5l1.71-1.71"/><line x1="2" y1="2" x2="22" y2="22"/></svg>',key:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>',chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>'};

const API='/api/v1';let tk=localStorage.getItem('ma_tk');
async function api(p,o={}){const h={'Content-Type':'application/json',...(o.h||{})};if(tk)h.Authorization='Bearer '+tk;const r=await fetch(API+p,{...o,headers:h});if(r.status===401){localStorage.removeItem('ma_tk');tk=null;route();return null}const d=await r.json();if(d.code!==0&&d.code!==undefined)throw new Error(d.msg||'Error');return d}
const G=p=>api(p),P=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b)}),U=(p,b)=>api(p,{method:'PUT',body:JSON.stringify(b)}),D=p=>api(p,{method:'DELETE'});
function toast(m,t='info'){const e=document.createElement('div');e.className='toast toast-'+(t==='success'?'ok':t==='error'?'er':'in');e.textContent=m;document.getElementById('toasts').appendChild(e);setTimeout(()=>e.remove(),3000)}
function modal(t,b,f){document.getElementById('mlc').innerHTML='<div class="ml-h"><h3>'+t+'</h3><button class="ml-x" onclick="cmodal()">'+I.x+'</button></div><div class="ml-b">'+b+'</div>'+(f?'<div class="ml-f">'+f+'</div>':'');document.getElementById('modal').classList.add('show')}
function cmodal(){document.getElementById('modal').classList.remove('show')}
function ta(s){if(!s)return'-';const d=new Date(s),n=Date.now(),f=Math.floor((n-d.getTime())/1000);if(f<60)return f+'秒前';if(f<3600)return Math.floor(f/60)+'分钟前';if(f<86400)return Math.floor(f/3600)+'小时前';return Math.floor(f/86400)+'天前'}
function uf(s){if(!s)return'-';const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d>0?d+'天 ':'')+h+'时'+m+'分'}
function eh(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

const pages={login:pgLogin,dashboard:pgDash,nodes:pgNodes,tunnels:pgTunnels,users:pgUsers,mqtt:pgMQTT,settings:pgSettings};
function route(){const h=location.hash.slice(1)||'dashboard';if(!tk&&h!=='login'){location.hash='#login';return}if(tk&&h==='login'){location.hash='#dashboard';return}(pages[h]||pages.dashboard)();document.querySelectorAll('.ni').forEach(e=>e.classList.toggle('on',e.dataset.p===h))}
window.addEventListener('hashchange',route);

function shell(title,html){const u=JSON.parse(localStorage.getItem('ma_u')||'{}');const h=location.hash.slice(1)||'dashboard';
const nav=(p,l,ic)=>'<div class="ni'+(h===p?' on':'')+'" data-p="'+p+'" onclick="location.hash=\'#'+p+'\'">'+ic+'<span>'+l+'</span></div>';
document.getElementById('app').innerHTML='<div class="app"><aside class="sb"><div class="sb-b">'+I.logo+'<span>MoleAgent</span></div><nav class="sb-n">'+nav('dashboard','仪表盘',I.dash)+nav('nodes','节点管理',I.node)+nav('tunnels','隧道管理',I.tunnel)+nav('users','用户管理',I.user)+nav('mqtt','MQTT',I.mqtt)+nav('settings','系统设置',I.gear)+'</nav><div class="sb-f"><div class="ui">'+eh(u.username||'admin')+'</div><button class="btn btn-g btn-sm" onclick="doOut()" style="color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.2)">'+I.out+' 退出</button></div></aside><div class="mn"><div class="tb"><h2>'+eh(title)+'</h2></div><div class="ct">'+html+'</div></div></div>'}

function pgLogin(){document.getElementById('app').innerHTML='<div class="login-wrap"><div class="lc"><div class="logo">'+I.logo+'</div><h1>MoleAgent</h1><p class="sub">管理后台登录</p><form onsubmit="doLogin(event)"><div class="fg"><label>用户名</label><input id="lu" type="text" autocomplete="username" required autofocus></div><div class="fg"><label>密码</label><input id="lp" type="password" autocomplete="current-password" required></div><button type="submit" class="btn btn-p btn-blk" id="lb">登 录</button></form></div></div>'}
async function doLogin(e){e.preventDefault();const b=document.getElementById('lb');b.disabled=true;b.textContent='登录中...';try{const r=await P('/auth/login',{username:document.getElementById('lu').value,password:document.getElementById('lp').value});tk=r.data.token;localStorage.setItem('ma_tk',tk);localStorage.setItem('ma_u',JSON.stringify(r.data.user));toast('登录成功','success');location.hash='#dashboard'}catch(ex){toast(ex.message,'error');b.disabled=false;b.textContent='登 录'}}
function doOut(){P('/auth/logout').catch(()=>{});localStorage.removeItem('ma_tk');localStorage.removeItem('ma_u');tk=null;location.hash='#login'}

async function pgDash(){shell('仪表盘','<div class="ld"><div class="sp"></div></div>');try{const[n,m]=await Promise.all([G('/nodes').catch(()=>({data:{items:[],total:0}})),G('/metrics').catch(()=>({data:{}}))]);const nl=n.data||{},on=(nl.items||[]).filter(x=>x.status==='online').length,tc=(nl.items||[]).reduce((s,x)=>s+x.tunnel_count,0),md=m.data||{};
shell('仪表盘','<div class="sg"><div class="sc"><div class="si gr">'+I.node+'</div><div><h3>'+on+'/'+(nl.total||0)+'</h3><p>在线节点</p></div></div><div class="sc"><div class="si bl">'+I.tunnel+'</div><div><h3>'+tc+'</h3><p>隧道总数</p></div></div><div class="sc"><div class="si pu">'+I.dash+'</div><div><h3>'+(md.goroutines||'-')+'</h3><p>Goroutines</p></div></div><div class="sc"><div class="si or">'+I.gear+'</div><div><h3>'+uf(md.uptime_seconds)+'</h3><p>运行时长</p></div></div></div><div class="cd"><div class="cd-h"><h3>系统资源</h3></div><div class="cd-b pad"><div class="cg" style="gap:12px"><div class="cc"><h4>运行信息</h4><div class="ci"><span class="l">内存分配</span><span class="v">'+((md.memory_alloc_mb||0).toFixed(1))+' MB</span></div><div class="ci"><span class="l">系统内存</span><span class="v">'+((md.memory_sys_mb||0).toFixed(1))+' MB</span></div><div class="ci"><span class="l">CPU 核数</span><span class="v">'+(md.cpu_num||'-')+'</span></div></div></div></div></div><div class="cd" style="margin-top:16px"><div class="cd-h"><h3>最近节点</h3></div><div class="cd-b"><table><thead><tr><th>ID</th><th>名称</th><th>状态</th><th>隧道</th><th>连接时间</th><th>心跳</th><th>远程地址</th></tr></thead><tbody>'+(nl.items||[]).slice(0,5).map(x=>'<tr><td><code>'+eh(x.id)+'</code></td><td>'+eh(x.name)+'</td><td>'+(x.status==='online'?'<span class="bdg bdg-ok">在线</span>':'<span class="bdg bdg-er">离线</span>')+'</td><td>'+x.tunnel_count+'</td><td>'+ta(x.connected_at)+'</td><td>'+ta(x.last_heartbeat)+'</td><td><code>'+eh(x.remote_addr||'-')+'</code></td></tr>').join('')+'<tr><td colspan="7" class="empty">'+((nl.items||[]).length===0?'暂无节点':'')+'</td></tr></tbody></table></div></div>')}catch(e){shell('仪表盘','<div class="empty">加载失败: '+eh(e.message)+'</div>')}}

async function pgNodes(){shell('节点管理','<div class="ld"><div class="sp"></div></div>');try{const r=await G('/nodes');const it=r.data.items||[];
shell('节点管理','<div class="cd"><div class="cd-h"><h3>节点列表 ('+r.data.total+')</h3><button class="btn btn-p btn-sm" onclick="pgNodes()">'+I.dash+' 刷新</button></div><div class="cd-b"><table><thead><tr><th>ID</th><th>名称</th><th>状态</th><th>隧道</th><th>连接时间</th><th>心跳</th><th>远程地址</th><th>操作</th></tr></thead><tbody>'+it.map(n=>'<tr><td><code>'+eh(n.id)+'</code></td><td>'+eh(n.name)+'</td><td>'+(n.status==='online'?'<span class="bdg bdg-ok">在线</span>':'<span class="bdg bdg-er">离线</span>')+'</td><td>'+n.tunnel_count+'</td><td>'+ta(n.connected_at)+'</td><td>'+ta(n.last_heartbeat)+'</td><td><code>'+eh(n.remote_addr||'-')+'</code></td><td class="acts"><button class="btn btn-g btn-sm" onclick="ndet(\''+eh(n.id)+'\')">'+I.chev+'</button>'+(n.status==='online'?'<button class="btn btn-g btn-sm" onclick="ndisc(\''+eh(n.id)+'\')" title="断开">'+I.unlink+'</button>':'')+'<button class="btn btn-d btn-sm" onclick="ndel(\''+eh(n.id)+'\')" title="删除">'+I.del+'</button></td></tr><tr id="nd-'+eh(n.id)+'" style="display:none"><td colspan="8" class="dr"><div id="ndc-'+eh(n.id)+'">加载中...</div></td></tr>').join('')+'</tbody></table></div></div>')}catch(e){shell('节点管理','<div class="empty">加载失败: '+eh(e.message)+'</div>')}}
async function ndet(id){const r=document.getElementById('nd-'+id),c=document.getElementById('ndc-'+id);if(r.style.display==='none'){r.style.display='';try{const d=await G('/nodes/'+id),n=d.data;const ts=(n.tunnels||[]).map(t=>'<div class="tchip"><strong>'+eh(t.name)+'</strong> · <span class="bdg bdg-in">'+t.type+'</span> · '+eh(t.target)+(t.domain?' · '+eh(t.domain):'')+(t.listen_port?' · :'+t.listen_port:'')+'</div>').join('');c.innerHTML='<div style="margin-bottom:8px"><strong>Token:</strong> <code>'+eh(n.token||'-')+'</code></div><div style="margin-bottom:8px"><strong>隧道:</strong> '+(ts||'无')+'</div><div><strong>连接:</strong> '+(n.connected_at||'-')+' &nbsp; <strong>心跳:</strong> '+(n.last_heartbeat||'-')+'</div>'}catch(e){c.textContent='加载失败'}}else r.style.display='none'}
async function ndisc(id){if(!confirm('确定断开节点 '+id+'？'))return;try{await D('/nodes/'+id+'/connection');toast('已断开','success');pgNodes()}catch(e){toast(e.message,'error')}}
async function ndel(id){if(!confirm('确定删除节点 '+id+'？'))return;try{await D('/nodes/'+id);toast('已删除','success');pgNodes()}catch(e){toast(e.message,'error')}}

async function pgTunnels(){shell('隧道管理','<div class="ld"><div class="sp"></div></div>');try{const[t,s]=await Promise.all([G('/tunnels').catch(()=>({data:{items:[],total:0}})),G('/tunnels/stats').catch(()=>({data:{}}))]);const it=t.data.items||[],st=s.data||{};
shell('隧道管理','<div class="sg"><div class="sc"><div class="si bl">'+I.tunnel+'</div><div><h3>'+(st.total_tunnels||0)+'</h3><p>隧道总数</p></div></div><div class="sc"><div class="si gr">'+I.tunnel+'</div><div><h3>'+(st.http_tunnels||0)+'</h3><p>HTTP</p></div></div><div class="sc"><div class="si pu">'+I.tunnel+'</div><div><h3>'+(st.tcp_tunnels||0)+'</h3><p>TCP</p></div></div><div class="sc"><div class="si or">'+I.tunnel+'</div><div><h3>'+(st.udp_tunnels||0)+'</h3><p>UDP</p></div></div></div><div class="cd"><div class="cd-h"><h3>隧道列表</h3></div><div class="cd-b"><table><thead><tr><th>名称</th><th>类型</th><th>目标</th><th>域名/端口</th><th>节点</th><th>操作</th></tr></thead><tbody>'+it.map(x=>'<tr><td><code>'+eh(x.name)+'</code></td><td><span class="bdg bdg-'+(x.type==='http'?'in':x.type==='tcp'?'pu':'wa')+'">'+(x.type||'').toUpperCase()+'</span></td><td><code>'+eh(x.target)+'</code></td><td>'+(x.domain?'<code>'+eh(x.domain)+'</code>':x.listen_port?':'+x.listen_port:'-')+'</td><td><code>'+eh(x.node_id)+'</code></td><td class="acts"><button class="btn btn-d btn-sm" onclick="tdel(\''+eh(x.name)+'\')">'+I.del+'</button></td></tr>').join('')+'</tbody></table></div></div>')}catch(e){shell('隧道管理','<div class="empty">加载失败: '+eh(e.message)+'</div>')}}
async function tdel(n){if(!confirm('确定删除隧道 '+n+'？'))return;try{await D('/tunnels/'+n);toast('已删除','success');pgTunnels()}catch(e){toast(e.message,'error')}}

async function pgUsers(){shell('用户管理','<div class="ld"><div class="sp"></div></div>');try{const[u,r]=await Promise.all([G('/users'),G('/roles')]);const ul=u.data||[],rl=r.data||[];
shell('用户管理','<div class="tabs"><div class="tab on" onclick="utab(this,\'ut\')">用户列表</div><div class="tab" onclick="utab(this,\'rt\')">角色管理</div></div><div id="ut"><div class="cd"><div class="cd-h"><h3>用户列表</h3><button class="btn btn-p btn-sm" onclick="ucr()">'+I.plus+' 创建用户</button></div><div class="cd-b"><table><thead><tr><th>ID</th><th>用户名</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody>'+ul.map(x=>'<tr><td><code>'+eh(x.id)+'</code></td><td>'+eh(x.username)+'</td><td>'+(x.status==='active'?'<span class="bdg bdg-ok">活跃</span>':'<span class="bdg bdg-er">禁用</span>')+'</td><td>'+ta(x.created_at)+'</td><td class="acts"><button class="btn btn-g btn-sm" onclick="uedit(\''+eh(x.id)+'\',\''+eh(x.username)+'\',\''+x.status+'\')">'+I.key+'</button>'+(x.id!=='admin'?'<button class="btn btn-d btn-sm" onclick="udel(\''+eh(x.id)+'\')">'+I.del+'</button>':'')+'</td></tr>').join('')+'</tbody></table></div></div></div><div id="rt" style="display:none"><div class="cd"><div class="cd-h"><h3>角色列表</h3></div><div class="cd-b"><table><thead><tr><th>ID</th><th>名称</th><th>描述</th><th>权限</th></tr></thead><tbody>'+rl.map(x=>'<tr><td><code>'+eh(x.id)+'</code></td><td>'+eh(x.name)+'</td><td>'+eh(x.description||'-')+'</td><td>'+(x.permissions||[]).map(p=>'<span class="bdg bdg-in" style="margin:2px">'+eh(p.resource)+':'+eh(p.action)+'</span>').join('')+'</td></tr>').join('')+'</tbody></table></div></div></div>')}catch(e){shell('用户管理','<div class="empty">加载失败: '+eh(e.message)+'</div>')}}
function utab(el,id){el.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));el.classList.add('on');document.getElementById('ut').style.display=id==='ut'?'':'none';document.getElementById('rt').style.display=id==='rt'?'':'none'}
function ucr(){modal('创建用户','<div class="fg"><label>用户名</label><input id="cuu" required></div><div class="fg"><label>密码</label><input id="cup" type="password" required></div>','<button class="btn btn-g" onclick="cmodal()">取消</button><button class="btn btn-p" onclick="ucrDo()">创建</button>')}
async function ucrDo(){try{await P('/users',{username:document.getElementById('cuu').value,password:document.getElementById('cup').value,status:'active'});toast('创建成功','success');cmodal();pgUsers()}catch(e){toast(e.message,'error')}}
function uedit(id,un,st){modal('编辑用户 - '+eh(un),'<div class="fg"><label>新密码（留空不修改）</label><input id="eup" type="password" placeholder="输入新密码"></div><div class="fg"><label>状态</label><select id="eus"><option value="active"'+(st==='active'?' selected':'')+'>活跃</option><option value="disabled"'+(st==='disabled'?' selected':'')+'>禁用</option></select></div>','<button class="btn btn-g" onclick="cmodal()">取消</button><button class="btn btn-p" onclick="ueditDo(\''+eh(id)+'\')">保存</button>')}
async function ueditDo(id){try{const p=document.getElementById('eup').value,s=document.getElementById('eus').value;if(p)await U('/users/'+id+'/password',{password:p});await U('/users/'+id+'/status',{status:s});toast('已更新','success');cmodal();pgUsers()}catch(e){toast(e.message,'error')}}
async function udel(id){if(!confirm('确定删除用户 '+id+'？'))return;try{await D('/users/'+id);toast('已删除','success');pgUsers()}catch(e){toast(e.message,'error')}}

async function pgMQTT(){shell('MQTT 管理','<div class="ld"><div class="sp"></div></div>');try{const[s,c,t]=await Promise.all([G('/mqtt/stats').catch(()=>({data:{}})),G('/mqtt/clients').catch(()=>({data:[]})),G('/mqtt/topics').catch(()=>({data:[]}))]);const sd=s.data||{},cl=c.data||[],tp=t.data||[];
shell('MQTT 管理','<div class="sg"><div class="sc"><div class="si gr">'+I.node+'</div><div><h3>'+(sd.clients_connected||0)+'</h3><p>在线客户端</p></div></div><div class="sc"><div class="si bl">'+I.tunnel+'</div><div><h3>'+(sd.subscriptions||0)+'</h3><p>订阅数</p></div></div><div class="sc"><div class="si pu">'+I.send+'</div><div><h3>'+(sd.messages_published||0)+'</h3><p>已发布</p></div></div></div><div class="cd" style="margin-bottom:16px"><div class="cd-h"><h3>消息发布</h3></div><div class="cd-b pad"><div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap"><div class="fg" style="flex:2;min-width:200px;margin:0"><label>Topic</label><input id="mt" placeholder="sensors/temperature"></div><div class="fg" style="flex:2;min-width:200px;margin:0"><label>Payload</label><input id="mp" placeholder="hello"></div><button class="btn btn-p" onclick="mqpub()">'+I.send+' 发布</button></div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div class="cd"><div class="cd-h"><h3>客户端 ('+cl.length+')</h3></div><div class="cd-b"><table><thead><tr><th>Client ID</th><th>用户名</th></tr></thead><tbody>'+cl.map(x=>'<tr><td><code>'+eh(x.client_id||x.ID||'')+'</code></td><td>'+eh(x.username||'-')+'</td></tr>').join('')+'</tbody></table></div></div><div class="cd"><div class="cd-h"><h3>Topics ('+tp.length+')</h3></div><div class="cd-b"><table><thead><tr><th>Topic</th><th>QoS</th><th>订阅</th></tr></thead><tbody>'+tp.map(x=>'<tr><td><code>'+eh(x.topic||x.Topic||x.filter||'')+'</code></td><td>'+(x.qos||x.Qos||'-')+'</td><td>'+(x.subscribers||x.Subscribers||'-')+'</td></tr>').join('')+'</tbody></table></div></div></div>')}catch(e){shell('MQTT 管理','<div class="empty">加载失败: '+eh(e.message)+'</div>')}}
async function mqpub(){const t=document.getElementById('mt').value,p=document.getElementById('mp').value;if(!t){toast('请输入 Topic','error');return}try{await P('/mqtt/publish',{topic:t,payload:p,qos:1,retain:false});toast('已发布','success')}catch(e){toast(e.message,'error')}}

async function pgSettings(){shell('系统设置','<div class="ld"><div class="sp"></div></div>');try{const[c,ak]=await Promise.all([G('/config').catch(()=>({data:{}})),G('/accesskey').catch(()=>({data:{}}))]);const d=c.data||{};
shell('系统设置','<div class="cg"><div class="cd"><div class="cd-h"><h3>服务器配置</h3></div><div class="cd-b pad"><div class="cg" style="gap:12px"><div class="cc"><h4>网络</h4><div class="ci"><span class="l">控制端口</span><span class="v">'+eh(d.server?.control_port||'-')+'</span></div><div class="ci"><span class="l">网关端口</span><span class="v">'+eh(d.server?.gateway_port||'-')+'</span></div><div class="ci"><span class="l">API 端口</span><span class="v">'+eh(d.server?.api_port||'-')+'</span></div><div class="ci"><span class="l">TLS</span><span class="v">'+(d.server?.tls_enabled?'已启用':'未启用')+'</span></div></div><div class="cc"><h4>MQTT</h4><div class="ci"><span class="l">状态</span><span class="v">'+(d.mqtt?.enabled?'已启用':'未启用')+'</span></div><div class="ci"><span class="l">TCP</span><span class="v">'+eh(d.mqtt?.tcp_port||'-')+'</span></div><div class="ci"><span class="l">WS</span><span class="v">'+eh(d.mqtt?.ws_port||'-')+'</span></div></div><div class="cc"><h4>认证</h4><div class="ci"><span class="l">JWT 有效期</span><span class="v">'+eh(d.auth?.jwt_expiry||'-')+'</span></div><div class="ci"><span class="l">Bcrypt Cost</span><span class="v">'+(d.auth?.bcrypt_cost||'-')+'</span></div></div><div class="cc"><h4>数据库</h4><div class="ci"><span class="l">路径</span><span class="v">'+eh(d.database?.path||'-')+'</span></div></div></div></div></div><div class="cd"><div class="cd-h"><h3>修改密码</h3></div><div class="cd-b pad"><div style="max-width:400px"><div class="fg"><label>当前密码</label><input id="cpo" type="password"></div><div class="fg"><label>新密码</label><input id="cpn" type="password"></div><button class="btn btn-p" onclick="chpw()">修改密码</button></div></div></div><div class="cd"><div class="cd-h"><h3>Access Key</h3><div>'+(ak.data?.enabled?'<button class="btn btn-d btn-sm" onclick="akdis()">禁用</button>':'<button class="btn btn-s btn-sm" onclick="akset()">启用</button>')+'</div></div><div class="cd-b pad"><p style="color:var(--t2);margin-bottom:12px">Access Key 用于 API 简单认证。</p><div class="fg"><label>设置 Key</label><div style="display:flex;gap:8px"><input id="akv" placeholder="输入新的 Access Key" style="flex:1"><button class="btn btn-p" onclick="akset()">保存</button></div></div></div></div></div>')}catch(e){shell('系统设置','<div class="empty">加载失败: '+eh(e.message)+'</div>')}}
async function chpw(){const o=document.getElementById('cpo').value,n=document.getElementById('cpn').value;if(!o||!n){toast('请填写完整','error');return}try{await P('/auth/changepass',{old_password:o,new_password:n});toast('密码已修改','success');document.getElementById('cpo').value='';document.getElementById('cpn').value=''}catch(e){toast(e.message,'error')}}
async function akset(){const k=document.getElementById('akv')?.value;if(!k){toast('请输入 Key','error');return}try{await U('/accesskey',{key:k});toast('已设置','success');pgSettings()}catch(e){toast(e.message,'error')}}
async function akdis(){if(!confirm('确定禁用？'))return;try{await D('/accesskey');toast('已禁用','success');pgSettings()}catch(e){toast(e.message,'error')}}

route();
</script>
</body>
</html>
